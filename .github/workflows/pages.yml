name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /nice-crochet
          # Optional: only set once the Apps Script click-tracking backend is deployed
          # (see scripts/apps-script/click-tracking.gs). Repo Settings → Secrets → Actions.
          # Unset = tracking/sort-by-popularity silently no-ops, rest of the site is unaffected.
          NEXT_PUBLIC_CLICK_TRACKING_URL: ${{ secrets.CLICK_TRACKING_URL }}
          NEXT_PUBLIC_CLICK_TRACKING_TOKEN: ${{ secrets.CLICK_TRACKING_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
